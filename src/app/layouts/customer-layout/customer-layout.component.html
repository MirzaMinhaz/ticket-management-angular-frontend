<div class="c-shell">
  <nav class="c-nav">
    <a routerLink="/customer/home" class="c-brand">TMS</a>

    <span class="c-divider"></span>

    <ul class="c-links">
      <li><a routerLink="/customer/bus-booking" routerLinkActive="active">Bus Tickets</a></li>
      <li><a routerLink="/customer/train-booking" routerLinkActive="active">Train Tickets</a></li>
      <li><a routerLink="/customer/my-tickets" routerLinkActive="active">My Tickets</a></li>
      <li><a routerLink="/customer/profile" routerLinkActive="active">Profile</a></li>
    </ul>

    <div class="c-actions">
      <div class="c-user" tabindex="0">
        <span class="c-avatar">{{ username.charAt(0).toUpperCase() }}</span>
        <span class="c-user-text">
          <span class="c-user-label">Logged in</span>
          <span class="c-user-name">{{ username }}</span>
        </span>
      </div>

      <button class="c-logout" (click)="logout()">Logout</button>

      <button class="c-burger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="c-mobile" [class.open]="menuOpen">
    <div class="c-mobile-user">
      <span class="c-avatar">{{ username.charAt(0).toUpperCase() }}</span>
      <span class="c-user-name">{{ username }}</span>
    </div>
    <a routerLink="/customer/bus-booking" (click)="menuOpen=false">Bus Tickets</a>
    <a routerLink="/customer/train-booking" (click)="menuOpen=false">Train Tickets</a>
    <a routerLink="/customer/my-tickets" (click)="menuOpen=false">My Tickets</a>
    <a routerLink="/customer/profile" (click)="menuOpen=false">Profile</a>
    <a class="logout-link" (click)="logout()">Logout</a>
  </div>

  <main class="c-content">
    <router-outlet />
  </main>

  <app-customer-footer></app-customer-footer>
</div>
