<div class="operator-container">
  <h2>Add Operator</h2>

  <form [formGroup]="operatorForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <label>Name:</label>
      <input formControlName="name" />
    </div>

    <div class="form-row">
      <label>Type:</label>
      <select formControlName="type">
        <option value="">-- Select Type --</option>
        <option value="Bus">Bus</option>
        <option value="Train">Train</option>
      </select>
    </div>

    <button type="submit" [disabled]="operatorForm.invalid || loading">Create</button>
  </form>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>

  <h2>Operator List</h2>
  <div *ngIf="loading">Loading...</div>

  <table *ngIf="!loading">
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Code</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let op of operators">
        <td>{{ op.name }}</td>
        <td>{{ op.type }}</td>
        <td>{{ op.operatorCode }}</td>
        <td>{{ op.createdAt | date: 'short' }}</td>
        <td>
          <button (click)="openEditModal(op)">✏️ Edit</button>
          <button (click)="delete(op.id)">🗑️ Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Edit Modal -->
  <div class="modal-backdrop" *ngIf="showEditModal">
    <div class="modal">
      <h3>Edit Operator</h3>

      <form [formGroup]="editForm" (ngSubmit)="onEditSubmit()">
        <div class="form-row">
          <label>Name:</label>
          <input formControlName="name" />
        </div>

        <div class="form-row">
          <label>Type:</label>
          <select formControlName="type">
            <option value="">-- Select Type --</option>
            <option value="Bus">Bus</option>
            <option value="Train">Train</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="submit" [disabled]="editForm.invalid || loading">Update</button>
          <button type="button" (click)="closeModal()">Cancel</button>
        </div>
      </form>

      <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
      <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
    </div>
  </div>
</div>
