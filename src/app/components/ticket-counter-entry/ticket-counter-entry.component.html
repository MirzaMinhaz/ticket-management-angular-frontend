<div class="container">
  <h1>{{ isEditMode ? 'Edit Ticket Counter' : 'New Ticket Counter Entry' }}</h1>

  <div *ngIf="loading" class="loading-message">
    <div class="spinner"></div>
    Loading data...
  </div>

  <div *ngIf="errorMessage" class="message error-message-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="message success-message-box">{{ successMessage }}</div>

  <form [formGroup]="ticketCounterForm" (ngSubmit)="onSubmit()" class="entry-form">
    <div class="form-grid">
      <div class="form-group">
        <label for="locationId">Location <span class="required">*</span></label>
        <select id="locationId" formControlName="locationId" [class.is-invalid]="isFieldInvalid('locationId')"
          [disabled]="locations.length === 0 && !isEditMode">
          <option *ngIf="locations.length === 0 && !isEditMode" value="">No Locations Available</option>
          <option *ngIf="isEditMode && !ticketCounterForm.get('locationId')?.value && locations.length === 0" value="">
            Loading Locations...</option>
          <option *ngFor="let loc of locations" [value]="loc.locationId"> {{ loc.name }} ({{ loc.type }})
          </option>
        </select>
        <div *ngIf="isFieldInvalid('locationId')" class="error-message">
          Location is required.
        </div>
      </div>

      <div class="form-group">
        <label for="counterName">Counter Name <span class="required">*</span></label>
        <input type="text" id="counterName" formControlName="counterName" placeholder="e.g., Main Counter 1"
          [class.is-invalid]="isFieldInvalid('counterName')">
        <div *ngIf="isFieldInvalid('counterName')" class="error-message">
          Counter Name is required.
        </div>
      </div>

      <div class="form-group">
        <label for="counterCode">Counter Code</label>
        <input type="text" id="counterCode" formControlName="counterCode" placeholder="Generated by System"
          [readonly]="true" [disabled]="!isEditMode">
      </div>

      <div class="form-group">
        <label for="contactNumber">Contact Number</label>
        <input type="text" id="contactNumber" formControlName="contactNumber" placeholder="e.g., +8801XXXXXXXXX">
      </div>

      <div class="form-group full-width">
        <label for="addressDetails">Address Details</label>
        <input type="text" id="addressDetails" formControlName="addressDetails"
          placeholder="e.g., Inside Sayedabad Bus Terminal, Shop #5">
      </div>

      <!-- <div class="form-group">
        <label for="operatingHours">Operating Hours</label>
        <input type="text" id="operatingHours" formControlName="operatingHours"
          [value]="ticketCounterForm.get('operatingHours')?.value" [disabled]="true">
      </div> -->

      <div class="form-group">
        <label for="operatingHours">Yes bank Hours</label>
        <input type="text" id="operatingHours" class="form-control" value="7:00 AM - 11:00 PM" disabled>
      </div>


      <div class="form-group checkbox-group full-width">
        <input type="checkbox" id="isActive" formControlName="isActive">
        <label for="isActive">Is Active</label>
      </div>
    </div>

    <div class="button-container">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn btn-primary"
        [disabled]="loading || ticketCounterForm.invalid || (locations.length === 0 && !isEditMode)">
        {{ loading ? 'Saving...' : (isEditMode ? 'Update Counter' : 'Create Counter') }}
      </button>
    </div>
  </form>
</div>
