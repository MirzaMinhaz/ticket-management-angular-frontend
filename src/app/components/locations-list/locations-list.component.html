<div class="container">
  <h1>Locations Management</h1>

  <section class="form-section">
    <h2>Add New Location</h2>
    <form [formGroup]="locationForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" formControlName="name" placeholder="e.g., Dhaka"
                 [class.is-invalid]="locationForm.get('name')?.invalid && locationForm.get('name')?.touched">
          <div *ngIf="locationForm.get('name')?.invalid && locationForm.get('name')?.touched" class="error-message">
            Name is required.
          </div>
        </div>
        <div class="form-group">
          <label for="type">Type <span class="required">*</span></label>
          <input type="text" id="type" formControlName="type" placeholder="e.g., City, Bus Terminal"
                 [class.is-invalid]="locationForm.get('type')?.invalid && locationForm.get('type')?.touched">
          <div *ngIf="locationForm.get('type')?.invalid && locationForm.get('type')?.touched" class="error-message">
            Type is required.
          </div>
        </div>
        <div class="form-group full-width">
          <label for="address">Address</label>
          <input type="text" id="address" formControlName="address" placeholder="e.g., Sayedabad Bus Terminal">
        </div>
        <!-- <div class="form-group">
          <label for="latitude">Latitude</label>
          <input type="number" step="any" id="latitude" formControlName="latitude" placeholder="e.g., 23.70">
        </div>
        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input type="number" step="any" id="longitude" formControlName="longitude" placeholder="e.g., 90.40">
        </div> -->
      </div>
      <div class="button-container">
        <button type="submit" [disabled]="loading" class="btn btn-primary">
          {{ loading ? 'Saving...' : 'Create Location' }}
        </button>
      </div>
    </form>
  </section>

  <div *ngIf="errorMessage" class="message error-message-box">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="message success-message-box">{{ successMessage }}</div>

  <section class="list-section">
    <h2>Existing Locations</h2>
    <div *ngIf="loading && locations.length === 0" class="loading-message">Loading locations...</div>
    <div *ngIf="!loading && locations.length === 0" class="no-data-message">No locations found. Add one above!</div>

    <ul class="item-list" *ngIf="locations.length > 0">
      <li *ngFor="let location of locations" class="list-item">
        <div class="item-details">
          <p class="item-title">{{ location.name }} <span class="item-subtitle">({{ location.type }})</span></p>
          <p class="item-info">{{ location.address || 'No address provided' }}</p>
          <!-- <p *ngIf="(location.latitude !== undefined && location.latitude !== null) && (location.longitude !== undefined && location.longitude !== null)" class="item-coordinates">
            Lat: {{ location.latitude }}, Lng: {{ location.longitude }}
          </p> -->
        </div>
        <div class="item-actions">
          </div>
      </li>
    </ul>
  </section>
</div>
