<div class="vehicle-container">

  <!-- PAGE HEADER -->
  <div class="header">
    <h2>Location Management</h2>
  </div>

  <!-- SUCCESS MESSAGE -->
  <div *ngIf="successMessage" class="alert success-alert">
    {{ successMessage }}
  </div>

  <!-- ADD VEHICLE CARD -->
  <div class="card add-card">
    <h3>Add New Location</h3>

    <form (ngSubmit)="save()" #vehicleForm="ngForm">
      <div class="grid">

        <!-- Name -->
        <div class="form-group">
          <label>Name</label>
          <input [(ngModel)]="selectedLocation.name" name="name" required />
        </div>

        <!-- TYPE -->
        <div class="form-group">
          <label>Type</label>
          <select [(ngModel)]="selectedLocation.type" name="type" required>
            <option value="City">City</option>
            <option value="Bus Terminal">Bus Terminal</option>
            <option value="Train Station">Train Station</option>
            <option value="Airport">Airport</option>
            <option value="Port">Port</option>
          </select>
        </div>

        <!-- Address -->
        <div class="form-group">
          <label>Address</label>
          <input [(ngModel)]="selectedLocation.address" placeholder="e.g., Sayedabad Bus Terminal" name="address" required />
        </div>
      </div>

      <div class="actions">
        <button class="btn primary">Save</button>
        <button class="btn secondary" type="button" (click)="reset()">Clear</button>
      </div>
    </form>
  </div>

  <!-- VEHICLE LIST -->
  <div class="card">
    <h3>Vehicle List</h3>

    <table class="styled-table">
      <thead>
        <tr>
          <th>SL</th>
          <th>Name</th>
          <th>Type</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let v of paginatedlocations; let i = index">
          <td>{{ (currentPage - 1) * itemsPerPage + i + 1 }}</td>
          <td>{{ v.name }}</td>
          <td>{{ v.type }}</td>
          <td>{{ v.address }}</td>

          <td class="action-buttons">
            <button class="btn small edit" (click)="openModal(v)">Edit</button>
            <button class="btn small delete" (click)="confirmDelete(v)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
      <button class="btn small" [disabled]="currentPage === 1" (click)="goToPreviousPage()">Prev</button>

      <button class="btn small page"
              *ngFor="let page of pages"
              [class.active]="page === currentPage"
              (click)="goToPage(page)">
        {{ page }}
      </button>

      <button class="btn small" [disabled]="currentPage === totalPages" (click)="goToNextPage()">Next</button>
    </div>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal-backdrop" *ngIf="showModal">
    <div class="modal">
      <button class="modal-close" (click)="closeModal()">×</button>

      <h3>Edit Vehicle</h3>

      <div *ngIf="modalSuccessMessage" class="alert success-alert">
        {{ modalSuccessMessage }}
      </div>

      <form (ngSubmit)="save()" #editForm="ngForm">
        <div class="grid">

          <div class="form-group">
            <label>Name</label>
            <input [(ngModel)]="selectedLocation.name" name="editName" />
          </div>

          <div class="form-group">
            <label>Type</label>
            <select [(ngModel)]="selectedLocation.type" name="editType">
              <option value="City">City</option>
            </select>
          </div>

          <div class="form-group">
            <label>Address</label>
            <input [(ngModel)]="selectedLocation.address" name="editAddress" />
          </div>

        </div>

        <div class="actions">
          <button class="btn primary">Update</button>
          <button type="button" class="btn secondary" (click)="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE MODAL -->
  <div class="modal-backdrop" *ngIf="showDeleteConfirmModal">
    <div class="modal modal-delete">
      <h3>Confirm Deletion</h3>


      <div class="actions">
        <button class="btn delete" (click)="deleteConfirmed()">Yes, Delete</button>
        <button class="btn secondary" (click)="cancelDelete()">Cancel</button>
      </div>
    </div>
  </div>
</div>
