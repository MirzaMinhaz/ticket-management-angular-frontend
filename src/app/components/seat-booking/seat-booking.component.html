<div class="booking-container">
  <header class="booking-header">
    <div class="title-block">
      <h2 class="page-title">Bus Seat Booking</h2>
      <div class="bus-info">
        <strong>{{ vehicle?.model || 'Bus' }}</strong>
        <span>({{ vehicle?.capacity || 0 }} seats)</span>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot available"></span><span>Available</span></div>
      <div class="legend-item"><span class="legend-dot selected"></span><span>Selected</span></div>
      <div class="legend-item"><span class="legend-dot reserved"></span><span>Booked</span></div>
    </div>
  </header>

  <section class="bus-body">
    <div class="driver-row">
      <div class="driver-cabin">
        <div class="steering"></div>
        <span class="driver-label">Driver</span>
      </div>
    </div>

    <!-- Seat grid: render rows top-to-bottom; each row displays 4 columns (col1, col2, aisle, col3, col4) -->
    <div class="seat-grid">
      <ng-container *ngFor="let row of rows; let i = index">
        <!-- Determine special classes -->
        <div
          class="row-grid"
          [class.last-row]="i === rows.length - 1"
          [class.first-odd]="i === 0 && oddCapacity"
        >
          <!-- Column 1 (could be empty when first row & oddCapacity removed A1) -->
          <div class="col-1">
            <ng-container *ngIf="getSeatByPosition(row, 1) as seat">
              <button
                class="seat"
                [class.available]="seat.status === 'available'"
                [class.selected]="seat.status === 'selected'"
                [class.reserved]="seat.status === 'reserved'"
                [disabled]="seat.status === 'reserved'"
                (click)="toggleSeat(seat)"
                title="{{seat.seatNumber}}"
              >
                {{ seat.seatNumber }}
              </button>
            </ng-container>
            <ng-container *ngIf="!getSeatByPosition(row,1)">
              <div class="seat placeholder"></div>
            </ng-container>
          </div>

          <!-- Column 2 -->
          <div class="col-2">
            <ng-container *ngIf="getSeatByPosition(row, 2) as seat">
              <button
                class="seat"
                [class.available]="seat.status === 'available'"
                [class.selected]="seat.status === 'selected'"
                [class.reserved]="seat.status === 'reserved'"
                [disabled]="seat.status === 'reserved'"
                (click)="toggleSeat(seat)"
                title="{{seat.seatNumber}}"
              >
                {{ seat.seatNumber }}
              </button>
            </ng-container>
            <ng-container *ngIf="!getSeatByPosition(row,2)">
              <div class="seat placeholder"></div>
            </ng-container>
          </div>

          <!-- Aisle column (visual gap) -->
          <div class="aisle-col"></div>

          <!-- Column 3 -->
          <div class="col-3">
            <ng-container *ngIf="getSeatByPosition(row, 3) as seat">
              <button
                class="seat"
                [class.available]="seat.status === 'available'"
                [class.selected]="seat.status === 'selected'"
                [class.reserved]="seat.status === 'reserved'"
                [disabled]="seat.status === 'reserved'"
                (click)="toggleSeat(seat)"
                title="{{seat.seatNumber}}"
              >
                {{ seat.seatNumber }}
              </button>
            </ng-container>
            <ng-container *ngIf="!getSeatByPosition(row,3)">
              <div class="seat placeholder"></div>
            </ng-container>
          </div>

          <!-- Column 4 -->
          <div class="col-4">
            <ng-container *ngIf="getSeatByPosition(row, 4) as seat">
              <button
                class="seat"
                [class.available]="seat.status === 'available'"
                [class.selected]="seat.status === 'selected'"
                [class.reserved]="seat.status === 'reserved'"
                [disabled]="seat.status === 'reserved'"
                (click)="toggleSeat(seat)"
                title="{{seat.seatNumber}}"
              >
                {{ seat.seatNumber }}
              </button>
            </ng-container>
            <ng-container *ngIf="!getSeatByPosition(row,4)">
              <div class="seat placeholder"></div>
            </ng-container>
          </div>
        </div>
      </ng-container>
    </div>

    <footer class="booking-footer">
      <div class="summary">
        <strong>Selected seats:</strong>
        <span *ngIf="selectedSeats.length; else none">{{ selectedSeatLabels }}</span>
        <ng-template #none><em>None</em></ng-template>
      </div>
      <div class="actions">
        <button class="btn ghost" (click)="clearSelection()" [disabled]="!selectedSeats.length">Clear</button>
        <button class="btn primary" (click)="confirmBooking()" [disabled]="!selectedSeats.length">Confirm</button>
      </div>
    </footer>
  </section>
</div>
