<div class="auth-page">
  <div class="column-layout">

    <!-- Welcome Card -->
    <div class="welcome-card">
      <h1 class="welcome-title">Welcome to TMS</h1>
      <p class="tagline">Book your bus & train tickets across Bangladesh</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-container">
      <div class="tabs">
        <button [class.active]="isLogin"  (click)="switchTab(true)">Login</button>
        <button [class.active]="!isLogin" (click)="switchTab(false)">Register</button>
      </div>

      <!-- ── LOGIN FORM ── -->
      <form *ngIf="isLogin" (ngSubmit)="onLogin()" class="auth-form">

        <input type="text"
               [(ngModel)]="loginData.username"
               name="username"
               placeholder="Username"
               required>

        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="loginData.password"
                 name="password"
                 placeholder="Password"
                 required>
          <span class="toggle-eye" (click)="togglePassword()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>

        <label class="remember-option">
          <input type="checkbox" [(ngModel)]="rememberPassword" name="rememberPassword">
          Remember me
        </label>

        <button type="submit" class="submit" [disabled]="loading">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <p class="alt-link">Admin? <a routerLink="/">Go to Admin Login →</a></p>
      </form>

      <!-- ── REGISTER FORM ── -->
      <form *ngIf="!isLogin" (ngSubmit)="onRegister()" class="auth-form">

        <input type="text"
               [(ngModel)]="registerData.username"
               name="username"
               placeholder="Username"
               required>

        <input type="email"
               [(ngModel)]="registerData.email"
               name="email"
               placeholder="Email address"
               required>

        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="registerData.password"
                 name="password"
                 placeholder="Password (min. 6 characters)"
                 required>
          <span class="toggle-eye" (click)="togglePassword()">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </span>
        </div>

        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'"
                 [(ngModel)]="registerData.confirmPassword"
                 name="confirmPassword"
                 placeholder="Confirm password"
                 required>
        </div>

        <button type="submit" class="submit" [disabled]="loading">
          <span *ngIf="!loading">Create Account</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

        <p class="alt-link">Already have an account?
          <a (click)="switchTab(true)" style="cursor:pointer">Login →</a>
        </p>
      </form>

    </div>
  </div>
</div>
