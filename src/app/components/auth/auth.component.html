<div class="auth-page">
  <div class="column-layout">
    <!-- Welcome Card -->
    <div class="welcome-card">
      <h1 class="welcome-title">Welcome to TMS</h1>
      <p class="tagline">Your Authentic Ticket Management Experience</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-container">
      <div class="tabs">
        <button [class.active]="isLogin" (click)="switchTab(true)">Login</button>
        <button [class.active]="!isLogin" (click)="switchTab(false)">Register</button>
      </div>

      <!-- Login Form -->
      <form *ngIf="isLogin" (ngSubmit)="onLogin()" class="auth-form">
        <input type="text" [(ngModel)]="loginData.username" name="username" placeholder="Username" required>

        <!-- Password with eye toggle -->
        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginData.password" name="password"
            placeholder="Password" required>
          <span class="toggle-eye" (click)="togglePassword()">
            <i class="{{ showPassword ? 'fas fa-eye-slash' : 'fas fa-eye' }}"></i>
          </span>
        </div>


        <!-- Remember password -->
        <label class="remember-option">
          <input type="checkbox" [(ngModel)]="rememberPassword" name="rememberPassword">
          Remember password
        </label>

        <button type="submit" class="submit" [disabled]="loading">
          <span *ngIf="!loading">Login</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>

      </form>

      <!-- Register Form -->
      <form *ngIf="!isLogin" (ngSubmit)="onRegister()" class="auth-form">
        <input type="text" [(ngModel)]="registerData.username" name="username" placeholder="Username" required>
        <input type="email" [(ngModel)]="registerData.email" name="email" placeholder="Email" required>

        <!-- Password with toggle -->
        <div class="password-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="registerData.password" name="password"
            placeholder="Password" required>
          <span class="toggle-eye" (click)="togglePassword()">
            <i class="{{ showPassword ? 'fas fa-eye-slash' : 'fas fa-eye' }}"></i>
          </span>
        </div>


        <button type="submit" class="submit">Register</button>
      </form>
    </div>
  </div>
</div>
