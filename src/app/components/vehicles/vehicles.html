<div class="vehicle-container">
  <h2 class="page-title">Vehicle Management</h2>

  <div *ngIf="successMessage" class="alert success-alert">
    {{ successMessage }}
  </div>

  <div class="vehicle-card">
    <h3 class="card-title">Add / Edit Vehicle</h3>
    <form (ngSubmit)="save()" #vehicleForm="ngForm" class="vehicle-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="type">Type</label>
          <select [(ngModel)]="selectedVehicle.type" name="type" id="type" required (change)="onTypeChange()">
            <option value="Bus">Bus</option>
            <option value="Train">Train</option>
          </select>
        </div>

        <div class="form-group">
          <label for="model">Model</label>
          <input [(ngModel)]="selectedVehicle.model" name="model" id="model" required />
        </div>

        <div class="form-group">
          <label for="licensePlate">License Plate</label>
          <input [(ngModel)]="selectedVehicle.licensePlate" name="licensePlate" id="licensePlate" required />
        </div>

        <div class="form-group">
          <label for="capacity">Capacity</label>
          <input type="number" [(ngModel)]="selectedVehicle.capacity" name="capacity" id="capacity" required />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary">Save</button>
        <button type="button" class="btn secondary" (click)="reset()">Clear</button>
      </div>
    </form>
  </div>

  <div class="list-section">
    <h3 class="card-title">Vehicle List</h3>
    <table class="vehicle-table">
      <thead>
        <tr>
          <th (click)="sortBy('type')">Type</th>
          <th (click)="sortBy('model')">Model</th>
          <th (click)="sortBy('licensePlate')">License Plate</th>
          <th (click)="sortBy('capacity')">Capacity</th>
          <th (click)="sortBy('vehicleCode')">Code</th>
          <th (click)="sortBy('operatorId')">Operator</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let v of paginatedVehicles">
          <td>{{ v.type }}</td>
          <td>{{ v.model }}</td>
          <td>{{ v.licensePlate }}</td>
          <td>{{ v.capacity }}</td>
          <td>{{ v.vehicleCode }}</td>
          <td>{{ v.operatorId ?? '—' }}</td>
          <td>
            <button class="btn small edit" (click)="select(v)">✏️ Edit</button>
            <button class="btn small delete" (click)="delete(v.id)">🗑️ Delete</button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination">
      <button class="btn small" [disabled]="currentPage === 1" (click)="goToPreviousPage()">⬅ Prev</button>
      <span>Page {{ currentPage }} of {{ totalPages }}</span>
      <button class="btn small" [disabled]="currentPage === totalPages" (click)="goToNextPage()">Next ➡</button>
    </div>
  </div>
</div>
