<!-- Toast Notification -->
<div *ngIf="notification" class="toast" [class.success]="notificationType==='success'"
  [class.error]="notificationType==='error'">
  <span>{{ notification }}</span>
  <button class="close-btn" (click)="closeNotification()">×</button>
</div>

<!-- Navbar -->
<nav class="navbar" *ngIf="showNavbar()">
  <div class="navbar-container">
    <a routerLink="/home" class="navbar-brand">TMS</a>
    <div class="navbar-links">
      <!-- <a routerLink="/seat-booking" class="nav-link" routerLinkActive="active-link">Seat Booking</a> -->
      <a routerLink="/locations" class="nav-link" routerLinkActive="active-link">Locations</a>
      <a routerLink="/ticket-counters/entry" class="nav-link" routerLinkActive="active-link">Ticket Counters</a>
      <a routerLink="/vehicles" class="nav-link" routerLinkActive="active-link">Vehicles</a>
      <a routerLink="/ticket" class="nav-link" routerLinkActive="active-link">Tickets</a>
      <a routerLink="/operators" class="nav-link" routerLinkActive="active-link">Operators</a>
      <a routerLink="/routes" class="nav-link" routerLinkActive="active-link">Routes</a>
      <a routerLink="/schedules" class="nav-link" routerLinkActive="active-link">Schedules</a>
    </div>

    <div class="navbar-user" *ngIf="getLoggedInUser()">
      Logged in as <strong>{{ getLoggedInUser() }}</strong>
    </div>


    <!-- ✅ Logout button -->
    <button class="logout-btn" (click)="logout()">Logout</button>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
